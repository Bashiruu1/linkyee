# Site Configuration

# Theme, mapped to the directory: ./themes/xxxx
theme: default

# HTML language setting
lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below.
plugins: []

# Optional Google Analytics tracking ID
google_analytics_id:

# HTML title
title: "Bashiruu1 Links"

# Avatar image path
avatar: "./images/profile.jpeg"

# Name section text
name: "@Bashiruu1"

# Tagline section text
tagline: >-
  Personal links and project updates.

# List of links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# text: The displayed text for the link
# title: The URL title
# url: The URL of the link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
links:
  - link:
      icon: "fa-brands fa-github"
      text: "GitHub"
      url: "https://github.com/Bashiruu1"
      alt: "Bashiruu1 on GitHub"
      title: "Bashiruu1 on GitHub"
      target: "_blank"

# List of social media links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# title: The URL title
# url: The URL of the social media link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
socials:
  - social:
      icon: "fa-brands fa-github"
      url: "https://github.com/Bashiruu1"
      title: "Bashiruu1 on GitHub"
      alt: "Bashiruu1 on GitHub"
      target: "_blank"

# Footer text
footer: >
  Thanks for visiting.

# Footer copyright message
copyright: >
  Copyright 2026 Bashiruu1. Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">linkyee</a>.
